<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NBA Draft Break</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./draft.css" />
  </head>
  <body>
    <main class="draft-app">
      <section class="draft-shell">
        <section class="draft-toolbar">
          <div class="draft-toolbar__meta">
            <span>Draft en cours</span>
            <strong id="pick-label">Pick 1/30</strong>
          </div>

          <div class="draft-toolbar__current">
            <span>Au tour de</span>
            <strong id="current-player-label">Spot 1</strong>
          </div>

          <section class="draft-controls" aria-label="Actions draft">
            <button id="show-recap" class="btn btn--primary" type="button" hidden>Afficher récap</button>
            <button id="hide-recap" class="btn" type="button" hidden>Masquer récap</button>
            <button id="undo" class="btn btn--primary" type="button">
              Annuler
            </button>
            <button id="clear-participants" class="btn" type="button">Vider noms</button>
            <button id="reset" class="btn btn--danger" type="button">
              Reset
            </button>
          </section>
        </section>

        <section class="draft-board">
          <div class="draft-board__frame"></div>
          <section class="players-panel">
            <div id="players" class="players-grid"></div>
          </section>

          <section class="teams-panel">
            <div class="teams-panel__header">
              <span>Equipes disponibles</span>
              <strong id="teams-left-label">30 restantes</strong>
            </div>
            <div id="teams" class="teams-grid"></div>
          </section>
        </section>
      </section>
    </main>

    <!-- Recap final plein ecran -->
    <div id="recap" class="recap" hidden>
      <div class="recap__backdrop"></div>
      <div class="recap__inner">
        <header class="recap__header">
          <p class="recap__eyebrow">Draft — Resultats</p>
          <h1 class="recap__title" id="recap-title">NBA</h1>
        </header>
        <div class="recap__grid" id="recap-grid"></div>
      </div>
    </div>

    <!-- Cinematic overlay plein ecran pour la revelation des picks -->
    <div id="cinematic" class="cinematic" hidden>
      <div class="cinematic__backdrop"></div>
      <div class="cinematic__content">
        <p class="cinematic__eyebrow" id="cinematic-eyebrow">Pick 1</p>
        <div class="cinematic__logo-wrap">
          <img class="cinematic__logo" id="cinematic-logo" alt="" />
        </div>
        <strong class="cinematic__label" id="cinematic-label">Lakers</strong>
        <p class="cinematic__player" id="cinematic-player"></p>
      </div>
    </div>

    <script src="./sport.js"></script>
    <script src="./draft.js"></script>
  </body>
</html>
